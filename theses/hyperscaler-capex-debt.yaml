- date: '2026-10-29'
  claim: 'Amazon Q3 capex $77.3bn; trailing-12-month FCF -$42.4bn (from -$7.6bn at Q2); 2026 cash capex about $220bn kept; Jassy indicated 2027 capex will rise significantly'
  source: https://www.sec.gov/Archives/edgar/data/0001018724/000101872426000038/amzn-20260930xex991.htm
evidence_against:
