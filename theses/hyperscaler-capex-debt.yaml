- date: '2026-10-29'
  claim: 'AWS revenue $46.0bn, +39.3%, fastest in nearly five years; AWS backlog $578bn (call, secondary)'
  source: https://finance.yahoo.com/markets/stocks/articles/amazon-com-q3-earnings-call-001416198.html
