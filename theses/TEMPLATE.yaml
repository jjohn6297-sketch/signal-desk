predictions:          # dated and checkable; scored by the learning loop
  - {id: p1, statement: "", probability: null, resolves: 2027-03-31, outcome: null}

catalysts:            # expected outcome written before the date
  - {date: 2026-11-01, event: "", expected: "", action_if_yes: "", action_if_no: ""}

kill_criteria:        # written before any position; any one hit = exit review
  - ""

expression: ""        # how a position would be taken, and maximum size band
notes: ""
