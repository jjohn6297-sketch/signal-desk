- date: '2026-10-28'
  claim: 'Microsoft: third-party capacity delays held calendar-2026 capex to about $170bn and pushed spend into H2; Azure still grew 48% (first of two hyperscalers needed for p1)'
  source: https://www.tradingkey.com/news/transcripts/262249601-tradingkey
- date: '2026-11-04'
  claim: 'Democrats won the Texas, Georgia and Ohio governor races on 3 Nov on pledges of data-centre moratoria or pauses'
  source: https://fortune.com/2026/11/04/democrats-midterm-election-2026-anti-data-center-governors-texas-georgia-ohio-ai-infrastructure-big-tech-spending-moratorium-regulations/
- date: '2026-11-06'
