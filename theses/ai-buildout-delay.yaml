id: ai-buildout-delay
title: 'The AI risk for 2027 is delivery delay, not demand: leveraged builders suffer, bottleneck owners gain'
type: contrarian
theme: hyperscalers
status: draft
opened: '2026-10-26'
horizon: 6 months
owner_conviction: null
consensus:
  view: Hyperscaler capex ~$785bn in 2026 and ~$1trn in 2027 (Moody's); long semis most crowded trade
variant_view: Capex exceeds operating cash flow (Meta 106%, Amazon ~105%); Texas paused data-centre grid approvals;
  47+ large US projects delayed or blocked in 2026; CoreWeave 2031 bond yield above 16%
evidence_for:
- date: '2026-10-21'
  claim: CoreWeave 9% Feb 2031 notes near 83 cents, yield 14.44%; Oct 2031 notes about 15% (above the 12% line in
    DELAY-3, below the 16% cited in the variant view)
