name: Daily snapshot

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC every day
  workflow_dispatch: {}      # run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Career boards
        run: python scripts/snapshot_jobs.py
        continue-on-error: true   # a broken board is recorded in board_status.csv
      - name: Indeed Hiring Lab
        run: python scripts/snapshot_hiringlab.py
      - name: Commit new data
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily snapshot $(date -u +%F)"
            git push
          fi
