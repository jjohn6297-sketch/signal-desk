  - {fund: tiger, name: Tiger Global Management, cik: 1167483, manager: Chase Coleman, style: Technology growth}
  - {fund: pershing, name: Pershing Square Capital Management, cik: 1336528, manager: Bill Ackman, style: Concentrated}
