# Funds tracked on the Smart money tab. Their 13F filings come from SEC EDGAR
# (scripts/snapshot_sec.py, on GitHub Actions). The first run writes data/funds/fund_status.csv
# with the name EDGAR holds for each CIK: fix any line whose name does not match.
# 13F shows only US-listed long positions (and listed options), 45 days after quarter end,
# with no shorts, cash or non-US listings.

contact: "Signal Desk research (personal, non-commercial) jjohn6297@gmail.com"  # SEC requires a contact in the User-Agent

funds:
  - {fund: altimeter, name: Altimeter Capital Management, cik: 1541617, manager: Brad Gerstner, style: Technology growth}
  - {fund: situational_awareness, name: Situational Awareness LP, cik: 2045724, manager: Leopold Aschenbrenner, style: AI build-out}
  - {fund: duquesne, name: Duquesne Family Office, cik: 1536411, manager: Stanley Druckenmiller, style: Macro}
