# Public career boards snapshotted every day by scripts/snapshot_jobs.py.
# ats: greenhouse | lever | ashby. The slug is the last part of the board's URL,
# e.g. boards.greenhouse.io/datadog -> datadog.
# Slugs marked "unverified" are first guesses: the first run writes data/jobs/board_status.csv,
# so fix or remove any board that shows ok = no.
# Large companies (Microsoft, Salesforce, Accenture...) use Workday or their own sites;
# those need a separate fetcher and are planned for Phase 1.

